name: update-data

# Cron times are UTC, Monday to Friday. Runs every 3 hours at minute 17 (00:17, 03:17, ... 21:17 UTC).
# Taiwan time is UTC+8, so these are 08:17, 11:17, 14:17, 17:17, 20:17, 23:17, 02:17, 05:17.
# GitHub scheduled runs can be delayed. Observed on 2026-10-13: one scheduled run started about 7h42m after
# the nearest planned time. Several runs per day are used so that one late or skipped run does not leave
# the data stale for a whole morning. The commit step does nothing when data did not change.
on:
  schedule:
    - cron: "17 */3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Fetch data
        working-directory: repo
        run: python3 generate.py

      - name: Commit and push if changed
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
