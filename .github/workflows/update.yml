name: update-data

# Cron times are UTC. 00:30 UTC = 08:30 Taiwan, 07:30 UTC = 15:30 Taiwan, Monday to Friday.
# GitHub may delay scheduled runs by 5 to 20 minutes. Default times, not yet checked against exchange closes.
on:
  schedule:
    - cron: "30 0 * * 1-5"
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Fetch data
        working-directory: repo
        run: python3 generate.py

      - name: Commit and push if changed
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
